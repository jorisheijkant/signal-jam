services:
  - type: cron
    name: signal-jam-scraper
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 */6 * * *"  # every 6 hours — adjust to taste
    disk:
      name: firefox-profile
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FIREFOX_PROFILE_PATH
        value: /data/firefox-profile
